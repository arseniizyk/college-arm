name: college-arm

services:
  db:
    image: postgres:16-alpine
    container_name: college-arm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Разовый контейнер: применяет миграции и обязан завершиться с кодом 0.
  # restart: "no" — иначе падение миграции превратилось бы в бесконечный
  # цикл перезапусков вместо одного внятного ошибки. server стартует только
  # после service_completed_successfully, то есть на уже актуальной схеме.
  migrate:
    build:
      context: ./server
    image: college-arm-server
    container_name: college-arm-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    user: "${SERVER_UID:-1000}:${SERVER_GID:-1000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Europe/Minsk}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["node", "scripts/migrate.js"]
    # HEALTHCHECK из Dockerfile рассчитан на работающий сервер; здесь процесса
    # на 7000 нет, и статус «unhealthy» был бы шумом при штатном выходе.
    healthcheck:
      disable: true

  server:
    build:
      context: ./server
    image: college-arm-server
    container_name: college-arm-server
    restart: unless-stopped
    # Даём серверу дописать начальный бэкап и закрыть пул соединений перед SIGKILL
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./server/.env
    user: "${SERVER_UID:-1000}:${SERVER_GID:-1000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Europe/Minsk}
      # Внутри контейнера порт всегда 7000; SERVER_PORT — только публикация на хосте
      PORT: 7000
      # Внутри compose БД доступна по имени сервиса
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CLIENT_ORIGIN: "http://localhost:${CLIENT_PORT:-8080}"
    ports:
      - "${SERVER_PORT:-7000}:7000"
    volumes:
      # Бэкапы pg_dump переживают пересборку контейнера
      - ./server/backups:/app/backups

  client:
    build:
      context: ./client
      args:
        # Адрес API, зашивается в билд CRA
        REACT_APP_API_URL: "http://localhost:${SERVER_PORT:-7000}"
    image: college-arm-client
    container_name: college-arm-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  pgdata:
